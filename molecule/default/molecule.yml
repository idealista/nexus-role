---
dependency:
  name: galaxy
driver:
  name: docker

platforms:
  - name: nexus-test
    image: ${DOCKER_BASE_IMAGE:-idealista/jdk:8u382-bullseye-temurin-jdk}
    privileged: false
    capabilities:
      - SYS_ADMIN
    tmpfs:
      - /tmp
      - /run
      - /run/lock
    volumes:
      - '/sys/fs/cgroup:/sys/fs/cgroup:rw'
    groups:
      - nexus
    command: '/lib/systemd/systemd'

provisioner:
  name: ansible
  lint:
    name: ansible-lint
    enabled: False
scenario:
  name: default
verifier:
  name: goss
  lint:
    name: yamllint
    enabled: False
